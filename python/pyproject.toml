[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ernest"
version = "0.1.0"
description = "Python SDK for ernest — a fast multi-agent framework (Go core). Sync + async clients with SSE streaming and typed HITL approvals."
readme = { text = "Python SDK for ernest. See PLAN.md / USERFLOW.md at the repository root for the API contract.", content-type = "text/markdown" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ernest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
