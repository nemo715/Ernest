<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claw — local AI worker</title>
<style>
  :root {
    --bg: #0b0f14; --fg: #c9d1d9; --dim: #6e7681; --dim2: #4b5360;
    --green: #3fb950; --cyan: #56d4dd; --amber: #d29922; --red: #f85149;
    --violet: #a371f7; --line: #21262d; --sel: #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13.5px/1.6 Consolas, "Cascadia Code", "JetBrains Mono", Menlo, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---- header: connection url · agent · session ---- */
  header {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 7px 14px; background: #0d1117; border-bottom: 1px solid var(--line);
    font-size: 12.5px; white-space: nowrap; overflow: hidden;
  }
  header .brand { color: var(--green); font-weight: 700; }
  header .brand::before { content: "⚡ "; }
  header .sep { color: var(--dim2); }
  header .info { color: var(--dim); }
  header .info b { color: var(--cyan); font-weight: 600; }
  .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim2); display: inline-block; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.busy { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .badge { padding: 1px 8px; border: 1px solid var(--line); border-radius: 3px; font-size: 11px; color: var(--dim); }
  .badge.real { color: var(--green); border-color: rgba(63,185,80,.5); }
  .badge.mock { color: var(--amber); border-color: rgba(210,153,34,.5); }

  /* ---- main log ---- */
  main { flex: 1; overflow-y: auto; padding: 14px 16px 10px; }
  .line { padding: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .who { font-weight: 700; }
  .who.user { color: var(--green); }
  .who.asst { color: var(--cyan); }
  .who.sys { color: var(--dim); }
  .who.err { color: var(--red); }
  .line.user .txt { color: var(--fg); }
  .line.asst .txt { color: var(--fg); }
  .line.sys .txt { color: var(--dim); font-size: 12.5px; }
  .line.err { color: var(--red); }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--cyan); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .runmeta { color: var(--dim); font-size: 12px; padding: 2px 0 8px; }

  /* ---- tool cards ---- */
  .tool { margin: 6px 0 6px 14px; border: 1px solid var(--line); border-left: 3px solid var(--cyan); background: #0d1117; font-size: 12.5px; }
  .tool .thead { display: flex; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); color: var(--cyan); }
  .tool .thead .tname { font-weight: 700; }
  .tool .thead .tstate { color: var(--dim); margin-left: auto; }
  .tool .thead .tstate.busy { color: var(--amber); }
  .tool .thead .tstate.ok { color: var(--green); }
  .tool .thead .tstate.err { color: var(--red); }
  .tool .tblock { padding: 6px 10px; color: var(--dim); border-top: 1px solid #161b22; white-space: pre-wrap; word-break: break-word; }
  .tool .tblock b { color: var(--dim); font-weight: 400; }
  .tool .tblock pre { white-space: pre-wrap; word-break: break-word; color: #9da7b3; margin-top: 3px; font-family: inherit; }
  .tool .tblock pre.ok { color: #8bc99b; }
  .tool .tblock pre.err { color: var(--red); }
  .tool.closed .tbody { display: none; }

  /* ---- approval ---- */
  .approval { margin: 8px 0 8px 14px; border: 1px solid rgba(210,153,34,.6); border-left: 3px solid var(--amber); background: #161106; padding: 8px 12px; font-size: 12.5px; }
  .approval .title { color: var(--amber); font-weight: 700; }
  .approval .cmd { margin: 6px 0; padding: 6px 8px; background: #0b0f14; border: 1px solid var(--line); color: var(--fg); white-space: pre-wrap; word-break: break-all; }
  .approval .btns { display: flex; gap: 10px; margin-top: 8px; }
  .approval button {
    font-family: inherit; font-size: 12.5px; cursor: pointer; padding: 3px 14px;
    background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 3px;
  }
  .approval button.approve { color: var(--green); border-color: rgba(63,185,80,.6); }
  .approval button.approve:hover { background: rgba(63,185,80,.15); }
  .approval button.reject { color: var(--red); border-color: rgba(248,81,73,.5); }
  .approval button.reject:hover { background: rgba(248,81,73,.12); }
  .approval button:disabled { opacity: .4; cursor: not-allowed; }
  .approval .hint { margin-top: 6px; color: var(--dim); font-size: 11.5px; }
  .approval .resolved { margin-top: 6px; color: var(--green); }
  .approval .resolved.rejected { color: var(--red); }

  /* ---- banner ---- */
  .banner { margin-bottom: 14px; color: var(--dim); font-size: 12.5px; }
  .banner .logo { color: var(--green); font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .banner .row { padding-left: 2px; }
  .banner .k { color: var(--dim2); display: inline-block; width: 76px; }
  .banner .v { color: #9da7b3; }

  /* ---- footer: status line + bar + input ---- */
  footer { flex: none; border-top: 1px solid var(--line); background: #0d1117; }
  #status { padding: 4px 14px; font-size: 11.5px; color: var(--dim); border-bottom: 1px solid #161b22; display: flex; gap: 12px; }
  #status .st { color: var(--green); }
  #status .st.running { color: var(--amber); }
  #status .st.error { color: var(--red); }
  #bar { padding: 3px 14px; font-size: 11.5px; color: var(--dim2); border-bottom: 1px solid #161b22; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar b { color: var(--dim); font-weight: 600; }
  .inputrow { display: flex; align-items: center; gap: 8px; padding: 8px 14px; }
  .prompt { color: var(--green); font-weight: 700; flex: none; }
  #input {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--fg); font: inherit; line-height: 1.5; max-height: 120px; caret-color: var(--green);
  }
  .kbd { color: var(--dim2); font-size: 11px; flex: none; }
</style>
</head>
<body>

<header>
  <span class="brand">claw</span>
  <span class="sep">·</span>
  <span class="info">worker@localhost:<b id="hPort">8081</b></span>
  <span class="sep">·</span>
  <span class="info">agent <b>worker</b></span>
  <span class="sep">·</span>
  <span class="info">session <b id="hSession">1</b></span>
  <div class="spacer"></div>
  <span id="modeBadge" class="badge">…</span>
  <span class="info" id="hModel"></span>
  <span class="dot" id="statusDot"></span>
</header>

<main id="log"></main>

<footer>
  <div id="status"><span class="st" id="stText">idle</span><span id="stExtra"></span></div>
  <div id="bar"><b>worker</b> · <span id="barModel">…</span> · tokens <span id="barTokens">0</span> · <span id="barCost">$0.0000</span> · <span id="barTime">0s</span></div>
  <div class="inputrow">
    <span class="prompt">❯</span>
    <textarea id="input" rows="1" placeholder="ask claw to do something… (enter to send · shift+enter newline · esc abort)"></textarea>
    <span class="kbd">esc: abort</span>
  </div>
</footer>

<script>
const AGENT = "worker";
const log = document.getElementById("log");
const inputEl = document.getElementById("input");
const stText = document.getElementById("stText");
const stExtra = document.getElementById("stExtra");
const statusDot = document.getElementById("statusDot");
const barTokens = document.getElementById("barTokens");
const barCost = document.getElementById("barCost");
const barTime = document.getElementById("barTime");

let busy = false;
let aborter = null;
let pendingApproval = null;   // approval card awaiting decision
let tokens = { in: 0, out: 0 };
let cost = 0;
let startedAt = 0;
let runCount = 0;

// ------------------------------------------------------------ banner ----
fetch("/api/info").then(r => r.json()).then(i => {
  document.getElementById("modeBadge").textContent = i.mode === "real" ? "real" : "mock";
  document.getElementById("modeBadge").className = "badge " + i.mode;
  document.getElementById("hModel").textContent = i.model;
  document.getElementById("barModel").textContent = i.model;
  const b = el("div", "banner");
  b.innerHTML = `<div class="logo">⚡ claw — local AI worker on ernest</div>
    <div class="row"><span class="k">model</span><span class="v">${i.model} · openrouter</span></div>
    <div class="row"><span class="k">backend</span><span class="v">${i.mode === "real" ? "real model (key detected)" : "mock (offline script)"}</span></div>
    <div class="row"><span class="k">workdir</span><span class="v">${i.cwd}</span></div>
    <div class="row"><span class="k">tools</span><span class="v">${i.tools.length} — ${i.tools.join(" ")}</span></div>
    <div class="row"><span class="k">approval</span><span class="v">${i.approvalRequired.join(", ")} (pauses for you)</span></div>
    <div class="row" style="margin-top:8px;color:var(--dim2)">try: “list the files here” · “create hello.md” · “what time is it?”</div>`;
  log.appendChild(b);
  statusDot.className = "dot on";
}).catch(() => statusDot.className = "dot");

// ------------------------------------------------------------ helpers ----
function el(cls, tag = "div") { const d = document.createElement(tag); d.className = cls; return d; }
function line(kind, text) {
  const d = el("line " + kind);
  const who = kind === "user" ? "you" : kind === "asst" ? "claw" : kind === "sys" ? "◈" : "✗";
  const w = document.createElement("span"); w.className = "who " + kind; w.textContent = who + " ";
  d.appendChild(w);
  const t = document.createElement("span"); t.className = "txt"; t.textContent = text;
  d.appendChild(t);
  log.appendChild(d); scroll();
  return d;
}
// terminal prose: strip markdown-ish wrappers like Hermes does
function termText(s) {
  return String(s)
    .replace(/\*\*(.+?)\*\*/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/^```[a-z]*\s*$/gm, "")
    .replace(/^```\s*$/gm, "");
}
function scroll() { log.scrollTop = log.scrollHeight; }
function setStatus(state, extra = "") {
  stText.textContent = state;
  stText.className = "st" + (state.includes("running") || state.includes("streaming") || state.includes("awaiting") ? " running" : state.includes("error") ? " error" : "");
  stExtra.textContent = extra;
  statusDot.className = "dot" + (state.includes("running") || state.includes("awaiting") ? " busy" : state.includes("idle") ? " on" : "");
}
function pretty(x) {
  if (x == null) return "";
  if (typeof x === "string") { try { return JSON.stringify(JSON.parse(x), null, 2); } catch (e) { return x; } }
  try { return JSON.stringify(x, null, 2); } catch (e) { return String(x); }
}
function trunc(s, n = 2500) { s = String(s); return s.length > n ? s.slice(0, n) + "\n…[truncated]" : s; }
function tick() {
  if (startedAt) barTime.textContent = Math.round((Date.now() - startedAt) / 1000) + "s";
}

// ------------------------------------------------------------ streaming ----
function send(text) {
  text = (text || inputEl.value).trim();
  if (!text || busy) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  line("user", text);
  runCount++;
  document.getElementById("hSession").textContent = runCount;
  startedAt = Date.now(); tick();
  streamRun("/api/chat", { agent: AGENT, input: text });
}

async function streamRun(path, body) {
  busy = true; aborter = new AbortController();
  setStatus("running", "…");
  try {
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: aborter.signal,
    });
    if (!resp.ok) { setStatus("error", "HTTP " + resp.status); line("err", "http " + resp.status + ": " + (await resp.text())); return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const ln of chunk.split("\n")) {
          if (!ln.startsWith("data:")) continue;
          try { handleEvent(JSON.parse(ln.slice(5).trim())); } catch (e) { /* skip bad frame */ }
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") { line("sys", "aborted by user (esc)"); setStatus("idle"); }
    else { setStatus("error"); line("err", "connection failed: " + e.message); }
  } finally {
    busy = false; aborter = null; tick();
  }
}

// ------------------------------------------------------------ events ----
let asstLine = null, asstDone = true;
let toolCard = null, toolArgsEl = null, toolResultEl = null, toolStateEl = null;

function handleEvent(ev) {
  switch (ev.type) {
    case "run.start":
      asstLine = line("asst", "");
      asstDone = false;
      setStatus("streaming", "run " + ev.runId.slice(0, 12));
      break;
    case "message.delta":
      if (asstLine && !asstDone) {
        const t = asstLine.querySelector(".txt");
        t.textContent += ev.delta || "";
        scroll();
      }
      break;
    case "message.complete":
      if (asstLine && !asstDone) {
        const t = asstLine.querySelector(".txt");
        const c = ev.message ? (ev.message.content || "") : (ev.content || "");
        t.textContent = termText(c || t.textContent);
        if (asstLine.querySelector(".caret")) asstLine.querySelector(".caret").remove();
        asstDone = true; asstLine = null;
      }
      break;
    case "tool.call": {
      const tc = ev.toolCall;
      const card = el("tool");
      card.innerHTML = `<div class="thead"><span class="tname">◈ ${tc.name}</span><span class="tstate busy">running…</span></div>`;
      toolStateEl = card.querySelector(".tstate");
      const body = el("tbody");
      const a = el("tblock"); a.innerHTML = "<b>args</b>"; a.appendChild(el("pre")).textContent = trunc(pretty(tc.arguments), 1200);
      const r = el("tblock"); r.innerHTML = "<b>result</b>";
      const rp = el("pre"); rp.className = "dim"; rp.textContent = "…";
      r.appendChild(rp);
      body.appendChild(a); body.appendChild(r);
      card.appendChild(body);
      log.appendChild(card); scroll();
      toolCard = card; toolResultEl = rp;
      break;
    }
    case "tool.result": {
      const tr = ev.toolResult;
      if (!toolCard) break;
      const ok = !tr.error;
      toolStateEl.textContent = tr.error ? "error" : "ok";
      toolStateEl.className = "tstate " + (tr.error ? "err" : "ok");
      toolResultEl.className = tr.error ? "err" : "ok";
      toolResultEl.textContent = trunc(tr.error ? tr.error : pretty(tr.content), 4000);
      scroll();
      break;
    }
    case "approval.requested": {
      const a = ev.approval;
      setStatus("awaiting approval", "…");
      const card = el("approval");
      const summary = (a.summary || "");
      let cmd = summary;
      try { const j = JSON.parse(summary); cmd = j.command || j.path || j.content || summary; } catch (e) { /* keep raw */ }
      card.innerHTML = `<span class="title">⚠ HITL approval required</span> — ${a.action}
        <div class="cmd"></div>
        <div class="btns"><button class="approve">[y] approve</button><button class="reject">[n] reject</button></div>
        <div class="hint">the run is paused until you decide</div>`;
      card.querySelector(".cmd").textContent = cmd;
      const approveBtn = card.querySelector(".approve"), rejectBtn = card.querySelector(".reject");
      const decide = (ok) => {
        pendingApproval = null;
        approveBtn.disabled = rejectBtn.disabled = true;
        card.querySelector(".hint").textContent = "resuming…";
        streamRun("/api/approve", { agent: AGENT, approvalId: a.id, approved: ok });
      };
      approveBtn.onclick = () => decide(true);
      rejectBtn.onclick = () => decide(false);
      pendingApproval = { approve: () => decide(true), reject: () => decide(false) };
      log.appendChild(card); scroll();
      break;
    }
    case "approval.resolved": {
      const a = ev.approval;
      const cards = log.querySelectorAll(".approval");
      const last = cards[cards.length - 1];
      if (last) {
        const h = last.querySelector(".hint");
        if (h) h.textContent = a.status === "approved" ? "✓ approved — continuing" : "✗ rejected — continuing";
        h.className = "resolved" + (a.status === "approved" ? "" : " rejected");
      }
      break;
    }
    case "run.metrics": {
      const m = ev.metrics || {};
      if (m.tokens) { tokens.in += m.tokens.inputTokens || 0; tokens.out += m.tokens.outputTokens || 0; updateBar(); }
      break;
    }
    case "run.complete": {
      const r = ev.result || {};
      const u = r.usage || {};
      tokens.in += u.inputTokens || 0; tokens.out += u.outputTokens || 0;
      const meta = r.metadata || {};
      cost = Math.max(cost, meta.costUsd || 0);
      const ms = meta.durationMs || r.durationMs || 0;
      setStatus(r.status === "completed" ? "idle" : r.status, ms ? (ms / 1000).toFixed(1) + "s" : "");
      updateBar();
      const d = el("runmeta");
      d.textContent = "✓ " + r.status + (ms ? " · " + (ms / 1000).toFixed(1) + "s" : "") + " · " + (tokens.in + tokens.out) + " tokens · $" + cost.toFixed(4);
      log.appendChild(d); scroll();
      break;
    }
    case "run.error":
      setStatus("error");
      line("err", ev.error || "run failed");
      break;
  }
}
function updateBar() {
  barTokens.textContent = tokens.in + "+" + tokens.out;
  barCost.textContent = "$" + cost.toFixed(4);
  tick();
}

// ------------------------------------------------------------ input ----
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px"; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (pendingApproval) { pendingApproval.reject(); return; }
    if (busy && aborter) { aborter.abort(); return; }
    inputEl.value = ""; inputEl.focus();
  }
  if (e.key === "y" && pendingApproval) { pendingApproval.approve(); return; }
  if (e.key === "n" && pendingApproval) { pendingApproval.reject(); return; }
});
inputEl.focus();
</script>
</body>
</html>
