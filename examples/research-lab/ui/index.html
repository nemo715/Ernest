<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ernest Research Lab</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --panel2: #161b28; --line: #232a3b;
    --text: #d7dce6; --dim: #8b93a7; --accent: #7c6cff;
    --lead: #a78bfa; --reviewer: #22d3ee; --analyst: #fbbf24; --writer: #34d399;
    --ok: #34d399; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent); }
  .badge {
    font-size: 11px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line);
    color: var(--dim); background: var(--panel2); text-transform: uppercase; letter-spacing: 1px;
  }
  .badge.real  { color: var(--ok);   border-color: #1f3d31; background: #0d1a14; }
  .badge.mock  { color: var(--warn); border-color: #3d311f; background: #1a150d; }
  .spacer { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
  aside {
    border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; background: var(--panel);
  }
  aside h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
  .agent {
    border: 1px solid var(--line); background: var(--panel2); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .agent .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .agent .name i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .agent .role { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .agent .status { font-size: 11px; color: var(--dim); margin-top: 6px; min-height: 15px; }
  .agent .status.work { color: var(--accent); }
  .agent .status.done { color: var(--ok); }
  .controls { padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .controls textarea {
    width: 100%; min-height: 64px; resize: vertical; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    padding: 10px 12px; font: inherit;
  }
  .controls textarea:focus { outline: 1px solid var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  button {
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    padding: 8px 18px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  section.feed { overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .ev { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--panel); animation: in 0.18s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .ev .h { font-size: 11px; color: var(--dim); display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .ev .h b { color: var(--text); }
  .ev pre { white-space: pre-wrap; font: 13px/1.6 ui-monospace, Consolas, monospace; color: var(--text); }
  .ev.lead .h b { color: var(--lead); }
  .ev.reviewer .h b { color: var(--reviewer); }
  .ev.analyst .h b { color: var(--analyst); }
  .ev.writer .h b { color: var(--writer); }
  .ev.delegate { border-left: 3px solid var(--accent); }
  .ev.tool { border-left: 3px solid var(--dim); padding: 6px 14px; }
  .ev.tool .h { margin-bottom: 0; }
  .ev .chip { font-size: 10px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; color: var(--dim); }
  .ev.complete { border-color: #1f3d31; background: #0d1a14; }
  .ev.complete .h b { color: var(--ok); }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  .answer { border-left: 3px solid var(--lead); }
  .cursor::after { content: "▌"; color: var(--accent); animation: blink 0.9s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .muted { color: var(--dim); font-size: 12px; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
</style>
</head>
<body>
<header>
  <h1>ERNEST <span>RESEARCH LAB</span></h1>
  <span id="modeBadge" class="badge">…</span>
  <span id="modelChip" class="chip"></span>
  <div class="spacer"></div>
  <span class="muted"><span id="connDot" class="dot"></span><span id="connLabel">idle</span></span>
</header>
<main>
  <aside>
    <h2>Team</h2>
    <div id="roster"></div>
    <h2 style="margin-top:16px">How it works</h2>
    <p class="muted" style="font-size:12px">
      The Principal Investigator plans the investigation, then delegates to
      the reviewer (literature &amp; evidence), the analyst (numbers) and the
      writer (prose) using the <code>delegate</code> tool. Every delegation
      streams live into this feed.
    </p>
  </aside>
  <div style="display:flex; flex-direction:column; min-width:0">
    <div class="controls">
      <textarea id="task" placeholder="Research question — e.g. &quot;Are LLM agent frameworks worth the overhead for batch evaluation workloads?&quot;"></textarea>
      <div class="row">
        <button id="runBtn" class="primary">▶ Run research</button>
        <button id="clearBtn">Clear</button>
        <button id="demoBtn">Load example</button>
      </div>
    </div>
    <section id="feed" class="feed"></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const agents = { lead: { c: "var(--lead)", r: "Principal Investigator" },
                 reviewer: { c: "var(--reviewer)", r: "Literature & Evidence" },
                 analyst: { c: "var(--analyst)", r: "Quantitative Analysis" },
                 writer: { c: "var(--writer)", r: "Academic Writing" } };
let es = null, runActive = false;

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function parseData(d) {
  if (typeof d === "string") { try { return JSON.parse(d); } catch { return { raw: d }; } }
  return d;
}
function addEv(cls, header, body) {
  const div = document.createElement("div");
  div.className = "ev " + cls;
  const h = document.createElement("div"); h.className = "h"; h.innerHTML = header;
  div.appendChild(h);
  if (body !== null) {
    const p = document.createElement("div"); p.innerHTML = body; div.appendChild(p);
  }
  $("feed").appendChild(div);
  $("feed").scrollTop = $("feed").scrollHeight;
  return div;
}
function setConn(label, on) {
  $("connLabel").textContent = label;
  $("connDot").classList.toggle("on", on);
}
function setAgentStatus(name, text, cls) {
  const el = document.querySelector(`.agent[data-name="${name}"] .status`);
  if (el) { el.textContent = text; el.className = "status" + (cls ? " " + cls : ""); }
}
function typewriter(el, text) {
  el.innerHTML = esc(text).replace(/\n/g, "<br>");
}

async function loadInfo() {
  const r = await fetch("/api/team/info");
  const info = await r.json();
  const badge = $("modeBadge");
  badge.textContent = info.mode + " mode";
  badge.classList.add(info.mode);
  $("modelChip").textContent = info.model;
  const roster = $("roster");
  roster.innerHTML = "";
  for (const a of info.agents) {
    const c = agents[a.name] ? agents[a.name].c : "var(--accent)";
    const div = document.createElement("div");
    div.className = "agent"; div.dataset.name = a.name;
    div.innerHTML = `<div class="name"><i style="background:${c}"></i>${esc(a.name)}</div>
      <div class="role">${esc(a.role)}</div><div class="status">idle</div>`;
    roster.appendChild(div);
  }
}

function run() {
  const task = $("task").value.trim();
  if (!task || runActive) return;
  runActive = true; $("runBtn").disabled = true;
  $("feed").innerHTML = "";
  for (const a of Object.keys(agents)) setAgentStatus(a, "idle", "");
  setConn("streaming", true);
  if (es) es.close();
  es = new EventSource("/api/team/run?task=" + encodeURIComponent(task));
  let answerEl = null, runStart = null;

  es.addEventListener("meta", e => {
    const m = JSON.parse(e.data);
    addEv("", `<b>research task</b><span class="chip">${m.mode}</span>`,
      `<pre>${esc(m.task)}</pre>`);
  });
  es.addEventListener("run", e => {
    const ev = JSON.parse(e.data);
    const t = ev.type;
    if (t === "run.start") {
      runStart = performance.now();
      addEv("lead", `run.start <b>${ev.runId}</b>`, null);
    } else if (t === "message.delta") {
      if (!answerEl) {
        answerEl = addEv("lead answer", `<b>lead</b> synthesizing…`, `<pre class="cursor"></pre>`);
        answerEl.querySelector(".h b").textContent = "answer";
      }
      const pre = answerEl.querySelector("pre");
      pre.textContent += ev.delta;
      pre.classList.remove("cursor");
      typewriter(pre, pre.textContent);
    } else if (t === "message.complete" && answerEl) {
      answerEl.querySelector("pre").classList.remove("cursor");
    } else if (t === "tool.call") {
      addEv("tool", `tool.call <b>${esc(ev.toolCall.name)}</b>`,
        `<pre>${esc(JSON.stringify(ev.toolCall.arguments))}</pre>`);
    } else if (t === "tool.result") {
      addEv("tool", `tool.result <b>${esc(ev.toolResult.name)}</b> <span class="chip">${ev.toolResult.error ? "error" : "ok"}</span>`,
        ev.toolResult.error ? `<pre>${esc(ev.toolResult.error)}</pre>` : null);
    } else if (t === "delegate.start") {
      const d = parseData(ev.data);
      setAgentStatus(d.member, "working…", "work");
      const name = d.member || "?";
      addEv(name, `delegate.start → <b>${esc(name)}</b>`,
        `<pre>task: ${esc(d.task)}</pre>`);
    } else if (t === "delegate.end") {
      const d = parseData(ev.data);
      const name = d.member || "?";
      setAgentStatus(name, "done ✓", "done");
      const div = addEv(name, `delegate.end ← <b>${esc(name)}</b> <span class="chip">${esc(d.status)}</span>`, null);
      const det = document.createElement("details");
      det.innerHTML = `<summary>view findings</summary><pre>${esc(d.output)}</pre>`;
      div.appendChild(det);
    } else if (t === "run.complete") {
      const r = ev.result;
      const ms = r.durationMs ?? Math.round(performance.now() - runStart);
      const tok = r.usage ? `in ${r.usage.inputTokens} / out ${r.usage.outputTokens}` : "";
      const cost = r.metadata && r.metadata.costUsd != null ? ` · $${Number(r.metadata.costUsd).toFixed(4)}` : "";
      addEv("complete", `run.complete <b>${esc(r.status)}</b>`,
        `<pre>${ms} ms · ${tok} tokens${cost}</pre>`);
      setConn("idle", false);
    } else if (t === "run.error") {
      addEv("complete", `<b>run.error</b>`, `<pre>${esc(ev.error)}</pre>`);
      setConn("idle", false);
    }
  });
  es.addEventListener("done", () => {
    runActive = false; $("runBtn").disabled = false;
    if (es) { es.close(); es = null; }
  });
  es.onerror = () => {
    runActive = false; $("runBtn").disabled = false;
    setConn("disconnected", false);
  };
}

$("runBtn").onclick = run;
$("clearBtn").onclick = () => { $("feed").innerHTML = ""; };
$("demoBtn").onclick = () => {
  $("task").value = "Is it worth using an LLM agent framework for batch evaluation workloads? Compare framework overhead (~0.2% of model latency) with the value of tool calling and delegation.";
};
loadInfo();
</script>
</body>
</html>
