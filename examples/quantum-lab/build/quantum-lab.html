<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum Playground for One Qubit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        #blochSphere {
            width: 400px;
            height: 400px;
            border: 1px solid black;
            background-color: white;
            margin: 20px auto;
        }
        #controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
        #readout {
            margin-top: 20px;
        }
        #readout p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Quantum Playground for One Qubit</h1>
    <canvas id="blochSphere" width="400" height="400"></canvas>
    
    <div id="controls">
        <button onclick="applyGate('X')">X</button>
        <button onclick="applyGate('Y')">Y</button>
        <button onclick="applyGate('Z')">Z</button>
        <button onclick="applyGate('H')">H</button>
        <button onclick="applyGate('S')">S</button>
        <button onclick="applyGate('T')">T</button>
        <button onclick="reset()">Reset</button>
    </div>
    
    <div id="readout">
        <p>Alpha: <span id="alpha">1.00</span></p>
        <p>Beta: <span id="beta">0.00</span></p>
        <p>Probability |α|²: <span id="probAlpha">1.00</span></p>
        <p>Probability |β|²: <span id="probBeta">0.00</span></p>
        <p>Circuit Tape: <span id="circuitTape"></span></p>
    </div>
    
    <script>
        class Complex {
            constructor(real, imag) {
                this.real = real;
                this.imag = imag;
            }

            add(other) {
                return new Complex(this.real + other.real, this.imag + other.imag);
            }

            subtract(other) {
                return new Complex(this.real - other.real, this.imag - other.imag);
            }

            multiply(other) {
                return new Complex(
                    this.real * other.real - this.imag * other.imag,
                    this.real * other.imag + this.imag * other.real
                );
            }

            magnitude() {
                return Math.sqrt(this.real * this.real + this.imag * this.imag);
            }

            normalize() {
                const norm = this.magnitude();
                if (norm === 0) return new Complex(0, 0);
                return new Complex(this.real / norm, this.imag / norm);
            }
        }

        let alpha = new Complex(1.0, 0.0); // Initial state |0>
        let beta = new Complex(0.0, 0.0); // Initial state |1>
        const circuit = [];
        const canvas = document.getElementById("blochSphere");
        const ctx = canvas.getContext("2d");
        const radius = 150;
        let isDragging = false;

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mouseup', stopDrag);
        canvas.addEventListener('mousemove', drag);

        function startDrag(event) {
            isDragging = true;
            updateThetaPhi(event);
        }

        function stopDrag() {
            isDragging = false;
        }

        function drag(event) {
            if (isDragging) {
                updateThetaPhi(event);
            }
        }

        function updateThetaPhi(event) {
            const canvasRect = canvas.getBoundingClientRect();
            const x = event.clientX - canvasRect.left - canvas.width / 2;
            const y = (canvas.height / 2) - (event.clientY - canvasRect.top); // Invert y-axis

            // Adjust theta calculation without doubling
            const theta = Math.acos(Math.max(-1, Math.min(1, y / radius)));
            const phi = Math.atan2(y, x); // Correct phi calculation

            // Update alpha and beta to reflect the new angles
            alpha = new Complex(Math.cos(theta / 2), 0); // Updating real part of alpha
            beta = new Complex(Math.sin(theta / 2) * Math.cos(phi), Math.sin(theta / 2) * Math.sin(phi)); // Complex representation of beta

            drawBlochSphere(); // Redraw the sphere
        }

        function updateReadout() {
            document.getElementById("alpha").innerText = `${alpha.real.toFixed(2)} + ${alpha.imag.toFixed(2)}i`;
            document.getElementById("beta").innerText = `${beta.real.toFixed(2)} + ${beta.imag.toFixed(2)}i`;
            document.getElementById("probAlpha").innerText = (alpha.magnitude() ** 2).toFixed(2);
            document.getElementById("probBeta").innerText = (beta.magnitude() ** 2).toFixed(2);
            document.getElementById("circuitTape").innerText = circuit.join(', ');
        }

        function drawBlochSphere() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, radius, 0, Math.PI * 2);
            ctx.stroke();

            const theta = 2 * Math.acos(alpha.magnitude()); // Correctly calculate theta for drawing
            const phi = Math.atan2(beta.imag, beta.real); // Correctly calculate phi for rendering

            const x = radius * Math.sin(theta) * Math.cos(phi);
            const y = radius * Math.sin(theta) * Math.sin(phi);

            // Draw the state arrow
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, canvas.height / 2); // Start from center
            ctx.lineTo(canvas.width / 2 + x, canvas.height / 2 - y);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.stroke();

            updateReadout(); // Update the readout every draw
        }

        function applyGate(gate) {
            let newAlpha, newBeta; // Temporary variables for new state

            switch (gate) {
                case 'X':
                    [alpha, beta] = [beta, alpha];  // X gate swaps
                    break;
                case 'Y':
                    [alpha, beta] = [beta.multiply(new Complex(0, -1)), alpha]; // Y gate with phase flip
                    break;
                case 'Z':
                    beta = beta.multiply(new Complex(-1, 0)); // Z gate flips the phase of beta
                    break;
                case 'H':
                    newAlpha = alpha.add(beta).multiply(new Complex(1 / Math.sqrt(2), 0));
                    newBeta = alpha.subtract(beta).multiply(new Complex(1 / Math.sqrt(2), 0));
                    alpha = newAlpha;
                    beta = newBeta;
                    break;
                case 'S':
                    beta = beta.multiply(new Complex(0, 1)); // S gate (i-phase)
                    break;
                case 'T':
                    const phaseT = new Complex(Math.cos(Math.PI / 8), Math.sin(Math.PI / 8)); // T phase
                    beta = beta.multiply(phaseT);
                    break;
            }

            // Joint normalization for both states
            const jointNorm = Math.sqrt(alpha.magnitude() ** 2 + beta.magnitude() ** 2);
            if (jointNorm !== 0) {
                alpha = new Complex(alpha.real / jointNorm, alpha.imag / jointNorm);
                beta = new Complex(beta.real / jointNorm, beta.imag / jointNorm);
            }

            circuit.push(gate); // Add gate to the circuit tape
            drawBlochSphere(); // Redraw the Bloch sphere
        }

        function reset() {
            alpha = new Complex(1.0, 0.0); // Reset to |0>
            beta = new Complex(0.0, 0.0);
            circuit.length = 0; // Clear the circuit tape
            drawBlochSphere(); // Reset visualization
        }
        
        // Initial drawing of the Bloch Sphere
        drawBlochSphere();
    </script>
</body>
</html>
